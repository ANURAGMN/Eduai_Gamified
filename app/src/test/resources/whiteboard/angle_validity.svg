<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" font-family="Arial, sans-serif" role="img" aria-label="Which Angle Pair Can Form a Triangle?"><title>Which Angle Pair Can Form a Triangle?</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#496d87"/></marker></defs>
<g id="validity_base"><rect x="5" y="5" width="890" height="650" rx="15" fill="#fbfdff" stroke="#8aa8bd" stroke-width="3"/><text x="35" y="55" font-size="28" fill="#203c50">Which Angle Pair Can Form a Triangle?</text><text x="35" y="100" font-size="23" fill="#203c50">Find the third angle: C = 180° − (the two given angles).</text></g>
<g id="pair_one_invalid"><rect x="40" y="140" width="460" height="115" rx="12" fill="#fce9e7" stroke="#8aa8bd" stroke-width="2"/><text x="60" y="177" font-size="26" fill="#203c50">Pair 1: 90° and 90°</text><text x="60" y="220" font-size="25" fill="#a34b35">Third angle 0° → INVALID</text></g>
<g id="pair_three_invalid"><rect x="40" y="420" width="460" height="115" rx="12" fill="#fce9e7" stroke="#8aa8bd" stroke-width="2"/><text x="60" y="457" font-size="26" fill="#203c50">Pair 3: 120° and 70°</text><text x="60" y="500" font-size="24" fill="#a34b35">Third angle −10° → INVALID</text></g>
<g id="pair_two_valid"><rect x="40" y="280" width="460" height="115" rx="12" fill="#e8f5ec" stroke="#8aa8bd" stroke-width="2"/><text x="60" y="317" font-size="26" fill="#203c50">Pair 2: 60° and 60°</text><text x="60" y="360" font-size="25" fill="#278766">Third angle 60° → VALID</text></g>
<g id="equilateral_classification"><path d="M550 455 L690 212.51 L830 455 Z" fill="none" stroke="#496d87" stroke-width="3" /><text x="680" y="290" font-size="25" fill="#203c50">60°</text><text x="580" y="430" font-size="25" fill="#203c50">60°</text><text x="755" y="430" font-size="25" fill="#203c50">60°</text><text x="575" y="510" font-size="25" fill="#203c50">All angles are 60°.</text><rect x="100" y="565" width="700" height="60" rx="12" fill="#e8f5ec" stroke="#8aa8bd" stroke-width="2"/><text x="130" y="604" font-size="25" fill="#203c50">Only Pair 2 works: an equilateral, acute triangle.</text></g>
</svg>
