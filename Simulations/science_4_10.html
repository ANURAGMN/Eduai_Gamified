<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14171a">
<title>Real-World Applications – Metals &amp; Non-metals</title>
<script>
  // Android WebView often measures 100vh/100dvh against an initial, incorrect
  // layout pass (e.g. before useWideViewPort/fillMaxSize settle), leaving a
  // gap of the page's dark background below a too-short #app. Computing the
  // real height in JS and exposing it as --vh avoids that entirely.
  //
  // IMPORTANT: that same early layout pass can report innerHeight as 0,
  // which would set --vh to 0px and collapse #app to nothing (a solid black
  // screen) — so we never write implausible readings, seed a sane fallback
  // from screen metrics first, and re-check as the WebView settles.
  function readViewportH(){
    var vv = window.visualViewport && window.visualViewport.height;
    var ih = window.innerHeight;
    var ch = document.documentElement && document.documentElement.clientHeight;
    var sh = (window.screen && (window.screen.availHeight || window.screen.height)) || 0;
    return Math.max(vv || 0, ih || 0, ch || 0, sh > 200 ? sh : 0);
  }
  function setRealVh(){
    var h = readViewportH();
    // Prefer a live reading; otherwise keep / seed from screen so --vh is never 0.
    if(!(h && h > 100)){
      h = (window.screen && (window.screen.availHeight || window.screen.height)) || 640;
    }
    if(h > 100){
      document.documentElement.style.setProperty('--vh', (h * 0.01) + 'px');
    }
  }
  setRealVh();
  window.addEventListener('load', setRealVh);
  window.addEventListener('resize', setRealVh);
  window.addEventListener('orientationchange', function(){ setTimeout(setRealVh, 50); setTimeout(setRealVh, 300); });
  if(window.visualViewport){ window.visualViewport.addEventListener('resize', setRealVh); }
  setTimeout(setRealVh, 50);
  setTimeout(setRealVh, 100);
  setTimeout(setRealVh, 400);
  setTimeout(setRealVh, 1000);
  setTimeout(setRealVh, 2000);
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EDEFEA; --paper-dim:#E1E4DD;
    --ink:#1C1F1D; --ink-soft:#565C57; --line: rgba(28,31,29,0.12);
    --metal-a:#7C8A93; --metal-b:#C9D2D6; --metal-shine: rgba(255,255,255,0.9); --copper:#B5703B;
    --nonmetal-a:#D9A441; --nonmetal-b:#EAC97A;
    --brand:#00796B; --brand-dark:#00594E;
    --success:#2F8F5B; --success-dim:#DCEEE3;
    --error:#C1443B; --error-dim:#F6DEDB;
    --gold:#C79A2E;
    --energy:#E23F84; --energy-dim:#FCE1EC;
    --review:#7A4FBF; --review-dim:#EFE7FB;
    --radius:18px;
    --disp:'Space Grotesk',sans-serif; --body:'Source Sans 3',sans-serif; --mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; min-height:100%; overflow-x:hidden;}
  /* Paper body (not --ink): if #app ever collapses during WebView settle, we show light UI
     chrome instead of a solid black screen. Letterboxing uses the same paper tone. */
  body{margin:0; font-family:var(--body); background:var(--paper); color:var(--ink); -webkit-font-smoothing:antialiased; overflow:hidden;}
  #app{max-width:480px; width:100%; margin:0 auto; height:100vh; height:100dvh; height:-webkit-fill-available; height:calc(var(--vh, 1vh) * 100); min-height:320px; min-height:-webkit-fill-available; background:var(--paper); display:flex; flex-direction:column; position:relative; overflow:hidden;}

  header{flex:0 0 auto; display:flex; align-items:center; gap:12px; padding:14px 16px 10px;}
  #closeBtn{border:none; background:none; font-size:20px; color:var(--ink-soft); cursor:pointer; line-height:1; padding:4px;}
  #progressTrack{flex:1; height:10px; background:var(--paper-dim); border-radius:999px; overflow:hidden; border:1px solid var(--line);}
  #progressFill{height:100%; width:0%; background:linear-gradient(90deg,var(--brand),#1FA391); border-radius:999px; transition:width .45s cubic-bezier(.4,0,.2,1);}
  #metaRight{display:flex; flex-direction:column; align-items:flex-end; gap:1px; position:relative; min-width:56px;}
  #pointsBadge{display:flex; align-items:center; gap:3px; font-family:var(--mono); font-weight:700; font-size:13px; color:var(--energy); background:var(--energy-dim); padding:3px 10px; border-radius:999px;}
  #stepBadge{font-family:var(--mono); font-size:10px; color:var(--ink-soft); margin-top:3px;}
  .pointPopup{
    position:absolute; right:0; top:-6px; font-family:var(--mono); font-weight:700; font-size:13px;
    color:var(--energy); pointer-events:none; white-space:nowrap; text-align:right;
    animation:floatUp 1.1s ease forwards;
  }
  .pointPopup small{display:block; font-weight:600; font-size:9.5px; color:var(--ink-soft); margin-top:1px;}
  @keyframes floatUp{0%{opacity:0; transform:translateY(6px);} 15%{opacity:1; transform:translateY(0);} 80%{opacity:1;} 100%{opacity:0; transform:translateY(-22px);}}

  main#stage{flex:1 1 auto; overflow-y:auto; padding:8px 22px 24px; display:flex; flex-direction:column;}
  .card{margin:auto 0; animation:rise .38s cubic-bezier(.2,.7,.3,1);}
  @keyframes rise{from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);}}

  .eyebrow{font-family:var(--mono); font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--brand-dark); margin:0 0 10px;}
  h1.title{font-family:var(--disp); font-weight:700; font-size:28px; line-height:1.15; margin:0 0 10px; color:var(--ink);}
  h2.title{font-family:var(--disp); font-weight:700; font-size:23px; line-height:1.2; margin:0 0 8px; color:var(--ink);}
  p.lede{font-size:16px; line-height:1.55; color:var(--ink-soft); margin:0 0 4px;}
  .bigicon{font-size:50px; line-height:1; margin-bottom:12px;}

  .swatch{width:56px; height:56px; border-radius:14px; flex:0 0 auto; position:relative; overflow:hidden; border:1px solid rgba(0,0,0,0.08);}
  .swatch.metal{background:linear-gradient(135deg,var(--metal-a),var(--metal-b) 55%, var(--metal-a)); background-size:220% 220%; animation:shine 3.2s ease-in-out infinite;}
  .swatch.metal::after{content:""; position:absolute; inset:0; background:linear-gradient(115deg, transparent 40%, var(--metal-shine) 50%, transparent 60%); background-size:220% 220%; animation:shine 3.2s ease-in-out infinite; mix-blend-mode:screen;}
  @keyframes shine{0%{background-position:0% 0%;} 50%{background-position:100% 100%;} 100%{background-position:0% 0%;}}
  .swatch.nonmetal{background:
      radial-gradient(circle at 22% 28%, rgba(0,0,0,0.06) 0 2px, transparent 3px),
      radial-gradient(circle at 62% 58%, rgba(0,0,0,0.05) 0 2px, transparent 3px),
      radial-gradient(circle at 40% 78%, rgba(0,0,0,0.05) 0 2px, transparent 3px),
      linear-gradient(160deg, var(--nonmetal-a), var(--nonmetal-b));}
  .swatch-row{display:flex; align-items:center; gap:14px; margin-bottom:14px;}
  .swatch-label{font-family:var(--mono); font-size:12px; color:var(--ink-soft);}
  .swatch-label b{color:var(--ink); font-size:13px;}

  .property-line{display:flex; align-items:center; gap:10px; background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-top:16px;}
  .property-line .dot{width:8px; height:8px; border-radius:50%; background:var(--brand); flex:0 0 auto;}

  /* ---- mascot ---- */
  .mascotRow{display:flex; align-items:flex-start; gap:10px; margin-bottom:16px; width:100%;}
  .mascotAvatar{width:50px; height:50px; flex:0 0 auto; animation:mascotIdle 2.6s ease-in-out infinite; transform-origin:center bottom; display:block;}
  @keyframes mascotIdle{0%,100%{transform:translateY(0) rotate(0deg);} 50%{transform:translateY(-4px) rotate(-2deg);}}
  @keyframes mascotHappy{0%{transform:translateY(0) rotate(0deg);} 30%{transform:translateY(-11px) rotate(-9deg);} 60%{transform:translateY(0) rotate(7deg);} 100%{transform:translateY(0) rotate(0deg);}}
  @keyframes mascotShake{0%,100%{transform:translateX(0) rotate(0deg);} 20%{transform:translateX(-6px) rotate(-5deg);} 40%{transform:translateX(6px) rotate(5deg);} 60%{transform:translateX(-4px) rotate(-3deg);} 80%{transform:translateX(4px) rotate(3deg);}}
  @keyframes mascotThink{0%,100%{transform:rotate(0deg);} 50%{transform:rotate(-11deg);}}
  .mascotBubble{position:relative; flex:1 1 auto; min-width:0; background:#fff; border:1px solid var(--line); border-radius:14px; padding:10px 13px; font-size:13px; line-height:1.4; font-weight:600; color:var(--ink); margin-top:2px; overflow-wrap:break-word; word-break:break-word;}
  .mascotBubble::before{content:""; position:absolute; left:-6px; top:13px; width:11px; height:11px; background:#fff; border-left:1px solid var(--line); border-bottom:1px solid var(--line); transform:rotate(45deg);}

  /* ---- review concept tag ---- */
  .review-tag{display:inline-flex; align-items:center; gap:6px; font-family:var(--mono); font-size:10.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--review); background:var(--review-dim); padding:4px 9px 4px 7px; border-radius:999px; margin-bottom:10px;}
  .review-tag .diamond{width:8px; height:8px; background:var(--review); border-radius:2px; transform:rotate(45deg); flex:0 0 auto;}

  /* ---- hint ---- */
  #hintBtn{flex:0 0 auto; width:52px; border:1.5px solid var(--line); background:#fff; border-radius:16px; font-size:19px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:border-color .15s, background .15s;}
  #hintBtn.used{border-color:var(--gold); background:#FFF7E0;}
  #hintBtn[disabled]{opacity:.35; cursor:not-allowed;}
  .footerRow{display:flex; gap:10px; align-items:stretch;}
  .footerRow #primaryBtn{flex:1;}
  .hint-box{margin-top:12px; background:#FFF7E0; border:1px solid #F0DDA0; border-radius:14px; padding:12px 14px; font-size:13.5px; color:#7A5D1E; line-height:1.5;}

  /* ---- guess options (Brilliant-style predict) ---- */
  .guess-options{display:flex; flex-direction:column; gap:10px; margin-top:8px;}
  .guess-opt{
    text-align:left; border:2px solid var(--line); background:#fff; border-radius:14px;
    padding:13px 14px; font-family:var(--body); font-size:14.5px; color:var(--ink); cursor:pointer;
    transition:border-color .15s, background .15s;
  }
  .guess-opt:active{transform:scale(.99);}
  .guess-opt.chosen{border-color:var(--ink); background:var(--paper-dim);}
  .guess-opt.locked{cursor:default;}

  /* ---- test rigs ---- */
  .test-rig{margin-top:14px; background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:20px; min-height:90px; display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden;}
  .rig-circuit{display:flex; align-items:center; gap:10px; font-size:30px;}
  .rig-circuit .wire{width:80px; height:4px; background:var(--metal-a); border-radius:2px; position:relative; overflow:hidden;}
  .rig-circuit .wire::after{content:""; position:absolute; top:0; left:-40%; width:40%; height:100%; background:linear-gradient(90deg,transparent,#fff,transparent); opacity:0;}
  .rig-circuit .wire.pulse::after{animation:pulseWire .9s ease;}
  @keyframes pulseWire{0%{left:-40%; opacity:0;} 15%{opacity:1;} 100%{left:100%; opacity:0;}}
  .rig-circuit .bulb{filter:grayscale(1) brightness(.8); transition:filter .3s;}
  .rig-circuit .bulb.lit{filter:none; text-shadow:0 0 18px #FFD166;}
  .rig-heat{width:100%;}
  .heat-icons{display:flex; justify-content:space-between; font-size:26px; margin-bottom:8px;}
  .heat-bar{height:14px; background:var(--paper-dim); border-radius:8px; overflow:hidden;}
  .heat-fill{height:100%; width:0%; background:linear-gradient(90deg,#F2532A,#FFD166); border-radius:8px;}
  .heat-fill.run{animation:heatgrow 1.1s ease forwards;}
  @keyframes heatgrow{to{width:100%;}}
  .rig-sound{display:flex; align-items:center; justify-content:center; gap:16px; font-size:40px; position:relative; height:70px;}
  .bell{transition:transform .1s;}
  .bell.struck{animation:ring .4s ease;}
  @keyframes ring{0%{transform:rotate(0);} 25%{transform:rotate(-14deg);} 50%{transform:rotate(10deg);} 75%{transform:rotate(-6deg);} 100%{transform:rotate(0);}}
  .wave{position:absolute; left:50%; top:50%; width:20px; height:20px; margin:-10px 0 0 -10px; border:2px solid var(--brand); border-radius:50%; opacity:.8; pointer-events:none;}
  .wave.go{animation:waveOut .9s ease-out forwards;}
  @keyframes waveOut{to{transform:scale(4); opacity:0;}}
  .rig-hammer{display:flex; align-items:center; justify-content:center; gap:14px; font-size:38px;}
  .hammer-icon{transform-origin:70% 30%; transition:transform .15s;}
  .hammer-icon.hit{animation:hammerHit .35s ease;}
  @keyframes hammerHit{0%{transform:rotate(0);} 40%{transform:rotate(-45deg);} 60%{transform:rotate(-45deg);} 100%{transform:rotate(0);}}
  .blob{display:inline-block; transition:transform .3s ease;}
  .blob.flat{transform:scaleX(2.1) scaleY(.55);}

  .reveal-box{margin-top:16px; background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:16px; display:none;}
  .reveal-box.show{display:block; animation:rise .3s ease;}
  .reveal-box .tag{display:inline-block; font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--brand-dark); background:var(--success-dim); padding:3px 8px; border-radius:6px; margin-bottom:8px;}
  .reveal-box .verdict{font-family:var(--disp); font-weight:700; font-size:15px; margin:0 0 6px;}
  .reveal-box .verdict.hit{color:var(--success);}
  .reveal-box .verdict.miss{color:var(--copper);}
  .whybtn{margin-top:14px; border:1.5px dashed var(--ink-soft); background:none; color:var(--ink); font-family:var(--body); font-weight:600; font-size:14px; padding:10px 16px; border-radius:12px; cursor:pointer; width:100%;}
  .whybtn:active{transform:scale(.99);}

  /* ---- quiz: drag + bins + voice ---- */
  .quiz-icon{font-size:40px; margin-bottom:4px;}
  .drag-zone{display:flex; justify-content:center; padding:18px 0 10px; touch-action:none;}
  .drag-card{display:flex; align-items:center; gap:10px; background:#fff; border:2px solid var(--ink); border-radius:14px; padding:12px 18px; font-family:var(--disp); font-weight:600; font-size:15px; cursor:pointer; user-select:none; touch-action:none; box-shadow:0 2px 0 var(--ink); position:relative; z-index:5;}
  .drag-card:active{cursor:grabbing;}
  .drag-card.dragging{cursor:grabbing; box-shadow:0 10px 24px rgba(0,0,0,0.18); transition:none;}
  .drag-card.settled{transition:transform .4s cubic-bezier(.2,.7,.3,1);}
  .drag-card.locked{pointer-events:none;}
  .bins{display:flex; gap:12px; margin-top:8px;}
  .bin{flex:1; border:2px dashed var(--line); border-radius:16px; padding:14px 10px; display:flex; flex-direction:column; align-items:center; gap:8px; transition:border-color .15s, background .15s; cursor:pointer;}
  .bin.locked{cursor:default; pointer-events:none;}
  .bin span{font-family:var(--mono); font-size:12px; color:var(--ink-soft);}
  .bin.hover{border-color:var(--brand); background:var(--success-dim);}
  .bin.correct{border-style:solid; border-color:var(--success); background:var(--success-dim);}
  .bin.incorrect{border-style:solid; border-color:var(--error); background:var(--error-dim);}
  .micbtn{margin-top:14px; width:100%; border:1.5px solid var(--line); background:#fff; color:var(--ink); font-family:var(--body); font-weight:600; font-size:14px; padding:12px 16px; border-radius:14px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;}
  .micbtn.listening{border-color:var(--brand); color:var(--brand-dark); animation:micPulse 1s ease-in-out infinite;}
  @keyframes micPulse{0%,100%{box-shadow:0 0 0 0 rgba(0,121,107,0.25);} 50%{box-shadow:0 0 0 8px rgba(0,121,107,0);}}
  .micbtn[disabled]{opacity:.4; cursor:not-allowed;}
  .hint{font-size:12.5px; color:var(--ink-soft); text-align:center; margin-top:10px;}
  #feedback{display:none; margin-top:14px; padding:14px 16px; border-radius:14px; font-size:14px; line-height:1.5;}
  #feedback.show{display:block; animation:rise .25s ease;}
  #feedback.ok{background:var(--success-dim); color:#1E5E3E;}
  #feedback.bad{background:var(--error-dim); color:#8C3229;}
  #feedback b{display:block; font-family:var(--disp); font-size:15px; margin-bottom:2px;}
  .bonus-tags{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px;}
  .bonus-tags span{font-family:var(--mono); font-size:10.5px; background:#fff; border:1px solid var(--line); border-radius:8px; padding:3px 7px;}

  .score-ring{width:120px; height:120px; border-radius:50%; margin:0 auto 20px; background:conic-gradient(var(--brand) calc(var(--pct,0)*1%), var(--paper-dim) 0); display:flex; align-items:center; justify-content:center; position:relative;}
  .score-ring::before{content:""; position:absolute; inset:8px; background:var(--paper); border-radius:50%;}
  .score-ring .num{position:relative; font-family:var(--disp); font-weight:700; font-size:26px;}
  .center{text-align:center;}
  .badge-row{display:flex; justify-content:center; gap:10px; margin-top:18px; flex-wrap:wrap;}
  .badge{font-family:var(--mono); font-size:12px; background:#fff; border:1px solid var(--line); border-radius:10px; padding:8px 12px;}
  .badge.gold{border-color:var(--gold); color:var(--gold); font-weight:700;}

  .factbox{margin-top:16px; background:#fff; border-left:4px solid var(--copper); border-radius:0 12px 12px 0; padding:14px 16px;}
  .sustainbox{margin-top:16px; background:#fff; border-left:4px solid var(--success); border-radius:0 12px 12px 0; padding:14px 16px;}
  ul.tips{margin:8px 0 0; padding-left:18px; color:var(--ink-soft); font-size:14.5px; line-height:1.6;}

  footer{flex:0 0 auto; padding:12px 22px calc(16px + env(safe-area-inset-bottom)); background:var(--paper); border-top:1px solid var(--line);}
  #primaryBtn{width:100%; border:none; border-radius:16px; padding:16px; font-family:var(--disp); font-weight:700; font-size:16px; letter-spacing:.02em; color:#fff; background:var(--brand); cursor:pointer; transition:transform .1s, opacity .15s, background .15s;}
  #primaryBtn:active{transform:scale(.98);}
  #primaryBtn:disabled{background:var(--paper-dim); color:#9BA39A; cursor:not-allowed;}
  #primaryBtn.correct-state{background:var(--success);}
  #primaryBtn.incorrect-state{background:var(--error);}

  /* ---- exit modal ---- */
  .modal-overlay{position:absolute; inset:0; background:rgba(20,23,20,0.5); display:flex; align-items:center; justify-content:center; padding:24px; z-index:50;}
  .modal-card{background:var(--paper); border-radius:20px; padding:24px 22px; max-width:340px; text-align:center; box-shadow:0 20px 50px rgba(0,0,0,0.3); animation:rise .25s ease;}
  .modal-card .modal-icon{font-size:36px; margin-bottom:8px;}
  .modal-card h3{font-family:var(--disp); font-size:19px; margin:0 0 8px;}
  .modal-card p{font-size:14px; color:var(--ink-soft); line-height:1.5; margin:0 0 18px;}
  .modal-card p b{color:var(--error);}
  .modal-actions{display:flex; flex-direction:column; gap:8px;}
  #modalCancel{border:none; background:var(--brand); color:#fff; font-family:var(--disp); font-weight:700; font-size:14.5px; padding:13px; border-radius:12px; cursor:pointer;}
  #modalExit{border:none; background:none; color:var(--error); font-family:var(--body); font-weight:600; font-size:13.5px; padding:8px; cursor:pointer;}

  @media (prefers-reduced-motion: reduce){
    .swatch.metal, .swatch.metal::after, .bell.struck, .hammer-icon.hit, .heat-fill.run, .wave.go, .pointPopup, .mascotAvatar{animation:none;}
    .card, .reveal-box, #feedback, .modal-card{animation:none;}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <button id="closeBtn" aria-label="Exit">✕</button>
    <div id="progressTrack"><div id="progressFill"></div></div>
    <div id="metaRight">
      <div id="pointsBadge">⚡ 0</div>
      <div id="stepBadge">1/15</div>
    </div>
  </header>
  <main id="stage"></main>
  <footer><div class="footerRow"><button id="hintBtn" style="display:none;">💡</button><button id="primaryBtn">Start</button></div></footer>
  <div id="exitModal" class="modal-overlay" style="display:none;">
    <div class="modal-card">
      <div class="modal-icon">⚠️</div>
      <h3>Leave the lesson?</h3>
      <p>Your progress and <b id="modalPoints">0 points</b> earned so far will be lost.</p>
      <div class="modal-actions">
        <button id="modalCancel">Keep going</button>
        <button id="modalExit">Exit anyway</button>
      </div>
    </div>
  </div>
</div>

<script>
const stage = document.getElementById('stage');
const progressFill = document.getElementById('progressFill');
const stepBadge = document.getElementById('stepBadge');
const pointsBadge = document.getElementById('pointsBadge');
const metaRight = document.getElementById('metaRight');
const primaryBtn = document.getElementById('primaryBtn');
const hintBtn = document.getElementById('hintBtn');
const closeBtn = document.getElementById('closeBtn');

const MASCOT_SVG = `<svg class="mascotAvatar" viewBox="0 0 52 52" xmlns="http://www.w3.org/2000/svg">
  <circle cx="26" cy="26" r="25" fill="#C9915B"/>
  <path d="M4 24C4 12 14 4 26 4S48 12 48 22C40 18 32 20 26 18C18 20 10 18 4 24Z" fill="#2B2320"/>
  <circle cx="16" cy="27" r="6.5" fill="#EDEFEA" stroke="#1C1F1D" stroke-width="1.5"/>
  <circle cx="36" cy="27" r="6.5" fill="#EDEFEA" stroke="#1C1F1D" stroke-width="1.5"/>
  <line x1="22.5" y1="27" x2="29.5" y2="27" stroke="#1C1F1D" stroke-width="1.5"/>
  <line x1="9.5" y1="27" x2="6" y2="26" stroke="#1C1F1D" stroke-width="1.5"/>

function mascotHTML(){

function reactMascot(type){

function beep(freq){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type='sine'; o.frequency.value=freq;
    o.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(0.22, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.5);
    o.start(); o.stop(ctx.currentTime+0.5);
  }catch(e){}
}

function testRigHTML(type, solved){
  if(type==='circuit') return `<div class="rig-circuit"><span>🔋</span><div class="wire" id="wire"></div><span class="bulb ${solved?'lit':''}" id="bulb">💡</span></div>`;

  if(type==='sound') return `<div class="rig-sound"><span class="hammer-icon" id="mallet" style="font-size:30px;">🥢</span><span class="bell" id="bell">🔔</span></div>`;
  if(type==='hammer') return `<div class="rig-hammer"><span class="hammer-icon" id="hammerIcon">🔨</span><span class="blob ${solved?'flat':''}" id="blob">🟡</span></div>`;
  return '';
}
function testLabel(type){

function runTest(type){
  if(type==='circuit'){
    document.getElementById('wire').classList.add('pulse');
    setTimeout(()=>document.getElementById('bulb').classList.add('lit'), 350);

  if(type==='heat'){ document.getElementById('heatFill').classList.add('run'); }
  if(type==='sound'){
    const mallet = document.getElementById('mallet'), bell = document.getElementById('bell');
    mallet.classList.add('hit'); bell.classList.add('struck'); beep(660);
    const rig = bell.parentElement;
    for(let i=0;i<3;i++){
      setTimeout(()=>{
        const w = document.createElement('div');
        w.className='wave'; rig.appendChild(w);
        requestAnimationFrame(()=>w.classList.add('go'));
        setTimeout(()=>w.remove(),900);
      }, i*150);
    }
  }
  if(type==='hammer'){
    document.getElementById('hammerIcon').classList.add('hit');
    setTimeout(()=>document.getElementById('blob').classList.add('flat'), 200);
  }
}

function wireExample(){
  const ex = EXAMPLES[idx-2];
  if(!ex) return;
  const st = exState[idx];

  document.querySelectorAll('.guess-opt').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(st.guessed!==null) return;
      st.guessed = parseInt(btn.dataset.i,10);
      render();
    });
  });

  const testBtn = document.getElementById('testBtn');
  if(testBtn){
    testBtn.addEventListener('click', ()=>{
      runTest(ex.test);
      setTimeout(()=>{
        st.tested = true;
        if(!st.awarded){
          st.awarded = true;
          if(st.guessed===ex.correct){
            const amt = st.hintUsed ? 8 : 12;
            awardPoints(amt, st.hintUsed ? ['🎯 Nice guess (hint used)'] : ['🎯 Nice guess']);
          }
        }
        render();
        reactMascot(st.guessed===ex.correct ? 'happy' : 'shake');
      }, 550);
    });
  }
}

function wireQuiz(){
  const dragCard = document.getElementById('dragCard');
  if(!dragCard) return;
  const qi = idx-(3+EXAMPLES.length);
  const q = QUIZ[qi];
  const st = quizState['q'+qi];
  const binMetal = document.getElementById('binMetal');
  const binNonmetal = document.getElementById('binNonmetal');
  const micBtn = document.getElementById('micBtn');

  function commit(kind, targetBin, method){
    if(st.checked) return;
    st.selected = kind; st.checked = true;
    const correct = kind===q.correct;
    const kindLabel = kind==='metal' ? 'Metal' : 'Non-metal';

    // Explicit bridge log for every method. Voice never fires a DOM click at
    // all, and a pointer-captured drag-drop's synthetic click (if it fires)
    // targets the drag card, not the bin — so the native heuristic alone
    // can't reliably tell which bin was chosen. Logging directly here
    // guarantees the right answer + verdict is recorded every time.
    if(window.AndroidBridge){
      try{
        const methodLabel = method==='voice' ? 'Voice answer' : method==='drag' ? 'Dragged to' : 'Tapped';
        window.AndroidBridge.logButtonClick(methodLabel + ': ' + kindLabel);
        window.AndroidBridge.logVerdict(correct);
      }catch(e){}
    }

    if(correct){
      score++;
      let pts = st.hintUsed ? 10 : 15;
      const tags = [st.hintUsed ? 'Correct +10 (hint used)' : 'Correct +15'];
      streak++;
      if(streak>=2){ pts += 8; tags.push('🔥 Streak +8'); }
      if(method==='voice'){ pts += 5; tags.push('🎤 Voice +5'); }
      awardPoints(pts, tags);
    } else {
      streak = 0;
    }
    if(targetBin){
      const cr = targetBin.getBoundingClientRect(), dr = dragCard.getBoundingClientRect();
      const dx = (cr.left+cr.width/2)-(dr.left+dr.width/2);
      const dy = (cr.top+cr.height/2)-(dr.top+dr.height/2);
      dragCard.classList.add('settled');
      dragCard.style.transform = `translate(${dx}px,${dy}px) scale(.7)`;
    }
    setTimeout(()=>{ render(); reactMascot(correct ? 'happy' : 'shake'); }, targetBin ? 380 : 0);
  }

  if(!st.checked){
    binMetal.addEventListener('click', ()=>commit('metal', binMetal, 'tap'));
    binNonmetal.addEventListener('click', ()=>commit('nonmetal', binNonmetal, 'tap'));

    let dragging=false, sx=0, sy=0;
    dragCard.addEventListener('pointerdown', e=>{
      dragging=true; sx=e.clientX; sy=e.clientY;
      dragCard.classList.add('dragging');
      dragCard.setPointerCapture(e.pointerId);
    });
    dragCard.addEventListener('pointermove', e=>{
      if(!dragging) return;
      const dx=e.clientX-sx, dy=e.clientY-sy;
      dragCard.style.transform = `translate(${dx}px,${dy}px)`;
      const mr=binMetal.getBoundingClientRect(), nr=binNonmetal.getBoundingClientRect();
      const px=e.clientX, py=e.clientY;
      binMetal.classList.toggle('hover', px>=mr.left&&px<=mr.right&&py>=mr.top&&py<=mr.bottom);
      binNonmetal.classList.toggle('hover', px>=nr.left&&px<=nr.right&&py>=nr.top&&py<=nr.bottom);
    });
    dragCard.addEventListener('pointerup', e=>{
      if(!dragging) return;
      dragging=false;
      dragCard.classList.remove('dragging');
      binMetal.classList.remove('hover'); binNonmetal.classList.remove('hover');
      const mr=binMetal.getBoundingClientRect(), nr=binNonmetal.getBoundingClientRect();
      const px=e.clientX, py=e.clientY;
      if(px>=mr.left&&px<=mr.right&&py>=mr.top&&py<=mr.bottom){ commit('metal', binMetal, 'drag'); return; }
      if(px>=nr.left&&px<=nr.right&&py>=nr.top&&py<=nr.bottom){ commit('nonmetal', binNonmetal, 'drag'); return; }
      dragCard.classList.add('settled');
      dragCard.style.transform = 'translate(0,0)';
    });

    if(SpeechRec && micBtn){
      micBtn.addEventListener('click', ()=>{
        let rec;
        try{ rec = new SpeechRec(); }catch(e){ return; }
        rec.lang='en-IN'; rec.interimResults=false; rec.maxAlternatives=1;
        micBtn.classList.add('listening'); micBtn.textContent='🎤 Listening…';
        rec.onresult = (ev)=>{
          const t = ev.results[0][0].transcript.toLowerCase();
          micBtn.classList.remove('listening');
          if(t.includes('non')) commit('nonmetal', binNonmetal, 'voice');
          else if(t.includes('metal')) commit('metal', binMetal, 'voice');
          else { micBtn.textContent='🎤 Didn\'t catch that — try again'; setTimeout(()=>{ if(!st.checked) micBtn.textContent='🎤 Say your answer'; },1500); }
        };
        rec.onerror = ()=>{ micBtn.classList.remove('listening'); micBtn.textContent='🎤 Say your answer'; };
        rec.onend = ()=>{ micBtn.classList.remove('listening'); };
        try{ rec.start(); }catch(e){}
      });
    }
  }
}

  idx=0; score=0; points=0; streak=0; exState={}; quizState={};

primaryBtn.addEventListener('click', ()=>{

  idx = Math.min(idx+1, STEP_COUNT-1);

  const midway = idx>0 && idx<STEP_COUNT-1;
  if(!midway){ resetAll(); return; }
  modalPoints.textContent = points + ' point' + (points===1?'':'s');
  exitModal.style.display='flex';
});
modalCancel.addEventListener('click', ()=>{ exitModal.style.display='none'; });
modalExit.addEventListener('click', ()=>{ exitModal.style.display='none'; resetAll(); });

render();
</script>
</body>
</html>
